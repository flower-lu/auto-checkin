name: Trae签到 & DeepSeek余额监控
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  task:
    runs-on: ubuntu-latest
    steps:
      - name: Install curl & jq
        run: sudo apt update && sudo apt install -y curl jq

      - name: Trae Checkin
        id: trae
        run: |
          TRAE_RT="${{ secrets.TRAE_REFRESH_TOKEN }}"
          DEVICE_ID="${{ secrets.TRAE_DEVICE_ID }}"
          token_resp=$(curl -s -X POST "https://api.trae.ai/auth/refresh" \
            -H "Content-Type: application/json" \
            -d "{\"refresh_token\":\"${TRAE_RT}\",\"device_id\":\"${DEVICE_ID}\"}")
          access_token=$(echo "$token_resp" | jq -r '.access_token')
          if [ "$access_token" = "null" ] || [ -z "$access_token" ];then
            MSG_TRAE="❌ Trae刷新Token失败"
          else
            ck=$(curl -s -X POST "https://api.trae.ai/user/checkin" -H "Authorization: Bearer ${access_token}")
            MSG_TRAE="✅ 签到结果：$ck"
          fi
          echo "MSG_TRAE=$MSG_TRAE" >> $GITHUB_OUTPUT

      - name: DeepSeek Balance
        id: ds
        run: |
          DS_KEY="${{ secrets.DEEPSEEK_API_KEY }}"
          res=$(curl -s "https://api.deepseek.com/user/balance" -H "Authorization: Bearer ${DS_KEY}")
          echo "MSG_DS=余额信息：$res" >> $GITHUB_OUTPUT

      - name: PushPlus Notify
        run: |
          PUSH_TOKEN="${{ secrets.PUSHPLUS_TOKEN }}"
          TITLE="Trae签到+DeepSeek余额通知"
          CONTENT="${{ steps.trae.outputs.MSG_TRAE }} \n\n ${{ steps.ds.outputs.MSG_DS }}"
          curl -s -X POST "http://www.pushplus.plus/send" \
          -H "Content-Type: application/json" \
          -d "{\"token\":\"${PUSH_TOKEN}\",\"title\":\"${TITLE}\",\"content\":\"${CONTENT}\"}"
